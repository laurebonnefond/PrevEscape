    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22303b"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
    <radialGradient id="neon" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/></radialGradient>
